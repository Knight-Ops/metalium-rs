name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Simulator suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # riscv32im-unknown-none-elf is a built-in target, so the firmware needs no
      # custom target JSON. llvm-tools supplies the objcopy and objdump that
      # crates/tt-tests/build.rs uses to produce and check the firmware image.
      - name: Install toolchain
        run: |
          rustup show active-toolchain
          rustup target add riscv32im-unknown-none-elf
          rustup component add clippy rustfmt llvm-tools

      - uses: Swatinem/rust-cache@v2

      # The simulator is pinned by tag and SHA-256 in PINS.toml and verified on
      # download, so caching it is safe: a cache hit that does not match the pin
      # is rejected by the same check.
      - name: Cache the pinned simulator
        uses: actions/cache@v4
        with:
          path: |
            vendor/libttsim_bh.so
            vendor/libttsim_bh_x2.so
          key: libttsim-${{ hashFiles('PINS.toml') }}

      # The specification tree is the third pinned input. It is verified by a
      # digest over the contents of the files the generators read, not by the
      # tarball's hash -- GitHub does not promise source archives are byte-stable.
      - name: Cache the pinned specification tree
        uses: actions/cache@v4
        with:
          path: vendor/tt-isa-documentation
          key: tt-isa-docs-${{ hashFiles('PINS.toml') }}

      - name: Fetch simulator
        run: cargo xtask fetch-ttsim

      - name: Fetch specification
        run: cargo xtask fetch-spec

      # The backend-configuration table is generated, never transcribed. This
      # proves the committed table still matches the pinned header, so a pin bump
      # cannot silently diverge from the code that depends on it.
      - name: Generated config table is current
        run: cargo xtask gen-cfg --check

      # The instruction table is generated from Bits32.lua and cross-checked against
      # the syntax blocks on the pages that embed each diagram. This proves the
      # committed table still matches the pinned specification, and that the two
      # descriptions of the instruction set still agree with each other.
      - name: Generated instruction table is current
        run: cargo xtask gen-isa --check

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # Runs the whole stack: the firmware is built for riscv32im and checked for
      # instructions Blackhole cannot execute, then every gate runs in-process
      # against libttsim. Deterministic -- time only advances inside
      # libttsim_clock -- so a failure here is real, never a flake.
      - name: Test
        run: cargo test --workspace

      # The silicon-gated tests cannot run here, but they must keep compiling or
      # they rot between now and the first hardware run.
      - name: Type-check the silicon-only suite
        run: cargo test --workspace --features tt-tests/silicon --no-run

      # Linted too, not just compiled: the silicon build cfg's out every
      # simulator-only probe, and what that leaves dead is only visible here.
      - name: Clippy (silicon build)
        run: cargo clippy --workspace --all-targets --features tt-tests/silicon

      # tt-ttsim binds a third-party .so. Binding it for development does not
      # compromise the native-Rust goal; shipping it would.
      - name: Simulator binding stays out of shippable crates
        run: cargo xtask check-no-sim-in-ship
