# Pinned upstream revisions.
#
# These are specification inputs, not dependencies. Bumping any of them is a
# deliberate act that invalidates the verification gates until they are re-run.

[tt-isa-documentation]
# The ISA specification. Fetched by `cargo xtask fetch-spec`; a local checkout at
# ../tt-isa-documentation is equivalent and gets the same check.
repo = "https://github.com/tenstorrent/tt-isa-documentation"
rev  = "f848eb668c2aeae742a88a49a86157e24a0a20c6"
# SHA-256 over the *contents* of the files this workspace reads from the
# specification -- Diagrams/Src/Bits32.lua, every page under the two
# TensixCoprocessor trees, the two NoC/Atomics.md, and Miscellaneous/FMA/fma.c --
# as (path, length, bytes) in sorted path order.
#
# fma.c joined the set when `tt_isa::numerics::fma_bh` was written: it is a hand
# port of that file's `fma_model_bh`, `crates/tt-tests/build.rs` compiles the file
# itself to differential-test the port, and every Phase 5 numerics gate asserts
# device results against it. An oracle that can change without the pin noticing is
# not an oracle. Adding it changed the digest from
# d08a44478ad67fa2c5516366536644741963203925f69b91976fe67eded9ae76 -- recorded here
# so the bump is legible as a deliberate widening of the set rather than a
# specification revision. The tree itself is unchanged, still rev f848eb66.
#
# Not the tarball's hash: GitHub regenerates source archives on demand and does
# not promise their bytes are stable, so a tarball hash can fail for reasons that
# have nothing to do with the specification. Hashing content is stable by
# construction, applies equally to a git checkout, and pins exactly the bytes the
# generator reads. Confirmed here by extracting the tarball and diffing it
# against an independent git checkout at this rev.
content_sha256 = "218cc3281f0216070c2586db23cc747b3ba3ae0b23de81114cbd15820abbfc30"

[ttsim]
# The golden-reference simulator. Fetched by `cargo xtask fetch-ttsim`.
#
# One tag covers every build, so the single-chip and dual-chip simulators cannot
# drift apart. `bh_x4` (two P300s) is pinned for Phase 8's sharding gate;
# `bh_x32` is published in the same release and deliberately not pinned until
# something needs it.
repo = "https://github.com/tenstorrent/ttsim"
tag  = "v1.10.9"

[[ttsim.assets]]
name   = "libttsim_bh.so"
sha256 = "e6ed2da11718683738d43f14a0bf4f13285b8621697b3165c1eaa240d36cfad5"

[[ttsim.assets]]
# The dual-chip (P300) build. Only the multi-chip gate loads it; every other gate
# runs against the single-chip build above.
name   = "libttsim_bh_x2.so"
sha256 = "e1ffbaf39c7d071a2f64d7072a586da5f9a7bef55907459edbdb185189d23108"

[[ttsim.assets]]
# Four chips: two P300 cards. Only the Phase 8 sharding gate loads it.
name   = "libttsim_bh_x4.so"
sha256 = "942a7a2a210259b77d1c44a7b13ac98fe672aec28d28e4385fcd30f6967756c1"

[tt-metal]
# Source of cfg_defines.h -- the 820 backend-configuration fields. Fetched and
# parsed by `cargo xtask gen-cfg` into crates/tt-isa/src/cfg/generated.rs, which
# IS committed; the header itself is not. This is the commit the specification
# cites (BackendConfiguration.md:17).
repo   = "https://github.com/tenstorrent/tt-metal"
rev    = "81989dcdb8f9b340c932ae7a71a346f4f08703eb"
path   = "tt_metal/hw/inc/blackhole/cfg_defines.h"
sha256 = "bc2636abc3ea04e6ca322923e6f2713b242857d021d8ef39b9180a14bcb1a5b8"

[burn]
# The tensor-level differential oracle. ttsim is the ISA-level one; this is what
# says which elements pair with which, which a bit-exact scalar model cannot.
#
# `burn-flex`, not `burn-ndarray`: crates.io marks the latter "[Deprecated] ... use
# burn-flex, burn-cuda, burn-rocm". Pinned as a dev-dependency of tt-tests only, so
# it cannot reach a shipped artefact -- `cargo xtask check-no-sim-in-ship` classifies
# tt-tests as dev-only and enforces that.
#
# Burn moves quickly and 0.21 is a restructuring: the associated `Device` now lives
# on `BackendTypes` rather than on `Backend`. The supertrait list in
# docs/RUST_IMPL_PLAN.md predates that, which is why Phase 7 re-verifies it against
# whatever version is pinned then rather than against the plan.
#
# Pinned exactly (`=0.21.0` in the workspace manifest) since Phase 7: burn-tt's
# forwarding of every op to burn-flex is generated from burn-backend's op traits
# (`cargo xtask gen-burn-delegate`), so the version the generator read and the
# version compiled must be the same one. burn-backend and burn-flex are real
# dependencies of burn-tt, which ships; `burn` (autodiff, nn, optim) is a
# tt-tests dependency only, for the training gates. Cargo.lock's checksums are
# what verify the sources.
repo    = "https://github.com/tracel-ai/burn"
version = "0.21.0"
crates  = ["burn-backend", "burn-flex", "burn-tensor", "burn"]

[mnist]
