[burn]
# The tensor-level differential oracle. ttsim is the ISA-level one; this is what
# says which elements pair with which, which a bit-exact scalar model cannot.
#
# `burn-flex`, not `burn-ndarray`: crates.io marks the latter "[Deprecated] ... use
# burn-flex, burn-cuda, burn-rocm". Pinned as a dev-dependency of tt-tests only, so
# it cannot reach a shipped artefact -- `cargo xtask check-no-sim-in-ship` classifies
# tt-tests as dev-only and enforces that.
#
# Burn moves quickly and 0.21 is a restructuring: the associated `Device` now lives
# on `BackendTypes` rather than on `Backend`. The supertrait list in
# docs/completed-plans/phases-0-10-roadmap.md predates that, which is why Phase 7 re-verifies it against
# whatever version is pinned then rather than against the plan.
#
# Pinned exactly (`=0.21.0` in the workspace manifest) since Phase 7: burn-tt's
# forwarding of every op to burn-flex is generated from burn-backend's op traits
# (`cargo xtask gen-burn-delegate`), so the version the generator read and the
# version compiled must be the same one. burn-backend and burn-flex are real
# dependencies of burn-tt, which ships; `burn` (autodiff, nn, optim) is a
# tt-tests dependency only, for the training gates. Cargo.lock's checksums are
# what verify the sources.
repo    = "https://github.com/tracel-ai/burn"
version = "0.21.0"
crates  = ["burn-backend", "burn-flex", "burn-tensor", "burn"]

[burn-backend-tests]
# Burn's own backend test suite, which `burn-tt-conformance` runs against `TtBackend`
# (`docs/plans/burn-backend-parity.md` 5.2). `burn-backend-tests` is not published to
# crates.io and 0.21 has no `testgen!` macro, so the suite is fetched from the Burn
# repository at the tag matching the `=0.21.0` crates the workspace compiles against:
# `cargo xtask fetch-burn-tests` extracts `crates/burn-backend-tests/tests/` into
# `vendor/burn-backend-tests/` (not committed).
#
# Pinned by the SHA-256 of the extracted tree (every file: path, length, bytes, in
# sorted path order), not of the tarball, which GitHub does not promise is
# byte-stable -- the same reasoning as the ISA specification. A test that changed
# underneath the expected-failures list would make "passes" mean something else.
repo    = "https://github.com/tracel-ai/burn"
tag     = "v0.21.0"
path    = "crates/burn-backend-tests/tests"
content_sha256 = "45c5b2f9c8903944bbfe0af1e31ef929377e2ec5e705000204a57acacfff9d16"
files   = 404

