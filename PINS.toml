# Pinned upstream revisions.
#
# These are specification inputs, not dependencies. Bumping any of them is a
# deliberate act that invalidates the verification gates until they are re-run.

[tt-isa-documentation]
# The ISA specification. Fetched by `cargo xtask fetch-spec`; a local checkout at
# ../tt-isa-documentation is equivalent and gets the same check.
repo = "https://github.com/tenstorrent/tt-isa-documentation"
rev  = "f848eb668c2aeae742a88a49a86157e24a0a20c6"
# SHA-256 over the *contents* of the files this workspace reads from the
# specification -- Diagrams/Src/Bits32.lua, every page under the two
# TensixCoprocessor trees, the two NoC/Atomics.md, and Miscellaneous/FMA/fma.c --
# as (path, length, bytes) in sorted path order.
#
# fma.c joined the set when `tt_isa::numerics::fma_bh` was written: it is a hand
# port of that file's `fma_model_bh`, `crates/tt-tests/build.rs` compiles the file
# itself to differential-test the port, and every Phase 5 numerics gate asserts
# device results against it. An oracle that can change without the pin noticing is
# not an oracle. Adding it changed the digest from
# d08a44478ad67fa2c5516366536644741963203925f69b91976fe67eded9ae76 -- recorded here
# so the bump is legible as a deliberate widening of the set rather than a
# specification revision. The tree itself is unchanged, still rev f848eb66.
#
# Not the tarball's hash: GitHub regenerates source archives on demand and does
# not promise their bytes are stable, so a tarball hash can fail for reasons that
# have nothing to do with the specification. Hashing content is stable by
# construction, applies equally to a git checkout, and pins exactly the bytes the
# generator reads. Confirmed here by extracting the tarball and diffing it
# against an independent git checkout at this rev.
content_sha256 = "218cc3281f0216070c2586db23cc747b3ba3ae0b23de81114cbd15820abbfc30"

