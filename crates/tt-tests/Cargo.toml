[package]
name = "tt-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# No library of its own. This crate exists to hold gates that span several crates
# -- notably any gate needing both tt-device and tt-ttsim, which tt-device itself
# must never depend on.
[lib]
path = "src/lib.rs"

[features]
# Gates tests that cannot pass against the simulator, either because ttsim does
# not model the hardware they exercise or because it explicitly declines to.
# They are compiled unconditionally so they cannot rot, and run only with
# `cargo test -p tt-tests --features silicon` against real hardware.
silicon = []

# Real dependencies, not dev-dependencies: `src/harness.rs` uses them. This crate
# is classified DEV_ONLY in `xtask/src/ship.rs`, so the simulator binding still
# cannot reach a shippable artefact -- `check-no-sim-in-ship` walks the shippable
# crates, and this is not one of them.
[dependencies]
tt-isa.workspace = true
tt-device.workspace = true
tt-layout.workspace = true
tt-ttsim.workspace = true

[dev-dependencies]
burn-flex = { version = "0.21", default-features = false, features = ["std"] }
burn-tensor = { version = "0.21", default-features = false, features = ["std"] }
