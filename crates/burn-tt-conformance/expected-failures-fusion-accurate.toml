[[group]]
category = "bug"
reason = "burn-fusion 0.21.0 panics on a Bool scalar: `ScalarIr::to_relative` (`stream/context.rs:1340`) is `todo!(\"Unsupported dtype ({self:?}) for scalar\")`, reached when the stream registers `bool_equal_elem`, `bool_not_equal_elem` or a `mask_fill` with a bool value; the fusion server thread dies and the client sees `CallError`. Not burn-tt's code, so only under `Fusion<TtBackend>` (the same tests pass on `TtBackend`), and a user of `burn_tt::Tt` meets it too. Needs an upstream change (hold the bool as a literal, as it holds none today). Roadmap, Track 1."
tests = [
    "tensor::tensor::bool::ops::comparison::test_bool_equal_elem",
    "tensor::tensor::bool::ops::comparison::test_bool_not_equal_elem",
    "tensor::tensor::bool::ops::mask::should_support_bool_mask_fill_ops",
]
