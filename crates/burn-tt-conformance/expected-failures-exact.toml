# The `--exact` profile: Burn's own backend tests with every matmul accumulating in exact F32,
# in k order, on the SFPU (`burn_tt::MatmulMode::Exact`, TT_EXACT_MATMUL=1), against
# `expected-failures.toml`, the default profile's list (the fast Matrix Unit matmul).
#
# Everything the default profile lists as `precision` passes here: the gelu gradient, conv2d,
# conv3d, LU and determinant entries were the Matrix Unit's group adder and TF32 truncation, not
# separate defects (docs/learnings/silicon-operating-notes.md, "Matmul accumulation: the Matrix
# Unit's group adder"). What is listed below is not about precision.
#
# `cargo xtask conformance --exact` compares every run with this file: an unlisted failure is a
# regression or a new finding, and a listed test that passes is stale, so the list only shrinks.
# Test names are `<binary>::<test path>`, as `cargo xtask conformance --exact --list` prints them.

[[group]]
category = "unsupported-dtype"
reason = "F64 is not a Tensix dtype: `float_cast` to F64 is refused by name. The two autodiff tests end as timeouts, as in the default profile (burn-tensor-testgen 0.21.0's `#[might_panic]` deadlocks when the panic message differs)."
tests = [
    "autodiff::base::cast::cast_keeps_gradient_flow_might_panic",
    "autodiff_checkpointing::base::cast::cast_keeps_gradient_flow_might_panic",
    "tensor::tensor::float::ops::slice::should_support_slice_fill_cast_f64",
    "autodiff_f16::base::cast::cast_keeps_gradient_flow_might_panic",
    "tensor_f16::f16::ops::slice::should_support_slice_fill_cast_f64",
]

[[group]]
category = "unsupported-op"
reason = "The exact matmul refuses by name a product it cannot do in a reasonable time: `[408, 261120] @ [261120, 408]` is 4.3e10 products, 41616 chunks against the limit of 1024 (`exact matmul: ... needs 41616 chunks (limit 1024); split the operands`), on ttsim and on silicon (card 0, run 1791761062). It passes in the default profile, on the Matrix Unit (13 s on silicon)."
tests = [
    "tensor::tensor::float::ops::transaction::should_support_transaction",
    "tensor_f16::f16::ops::transaction::should_support_transaction",
]

[[group]]
category = "timeout"
reason = "The exact matmul is composed from SFPU ops and the simulator does not finish these in the limit (120 s in the canonical run: the attention test takes 259 s, the 300 to 500 square LU and determinant tests and the CTC losses far more, each thousands of small device launches), but each passes on silicon, card 0, in exact mode: attention in 3.7 s (run 1791761017), the CTC losses in 4 to 8 s (1791761021), the 300 x 300 determinants in 43 s (1791760863), and the LU tests in 14 to 579 s (1791758996), within the 900 s limit. Not a defect: ttsim speed. (Silicon runs of the default profile fail the LU and determinant tolerances that these meet.)"
tests = [
    "autodiff::base::ctc::test_ctc_loss_scaled_swap_dims_then_narrow_autodiff",
    "autodiff_checkpointing::base::ctc::test_ctc_loss_scaled_swap_dims_then_narrow_autodiff",
    "tensor::tensor::float::linalg::det::test_det_300x300_all_ones",
    "tensor::tensor::float::linalg::det::test_det_300x300_all_zeros",
    "tensor::tensor::float::linalg::det::test_det_300x300_identity_matrix",
    "tensor::tensor::float::linalg::lu::test_lu_300x500_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_3x300x500_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_3x500x300_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_500x300_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_500x500_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_5x300x300_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_medium_tall",
    "tensor::tensor::float::linalg::lu::test_lu_medium_wide",
    "tensor::tensor::float::module::attention::test_attention_no_mask",
    "tensor::tensor::float::module::ctc::test_ctc_loss_long_mixed_input_lengths",
    "tensor::tensor::float::module::ctc::test_ctc_loss_long_sequence",
]

[[group]]
category = "timeout"
reason = "F16 (`tensor_f16`, `autodiff_f16`): the exact matmul is composed from SFPU ops and the simulator does not finish these in the limit (120 s). Each passes on card 0 in the default profile (run 1791811392: 9 to 355 s for the LU block dispatches, 22 to 49 s for the CTC losses, 38 s for the 300 x 300 determinants); the exact profile on silicon was not run, because the exact matmul is about 1,000 times slower than the fast one. So this is ttsim speed on evidence from the fast profile, not a measurement of the exact path."
tests = [
    "autodiff_f16::base::ctc::test_ctc_loss_scaled_swap_dims_then_narrow_autodiff",
    "tensor_f16::f16::linalg::det::test_det_300x300_all_ones",
    "tensor_f16::f16::linalg::det::test_det_300x300_all_zeros",
    "tensor_f16::f16::linalg::det::test_det_300x300_identity_matrix",
    "tensor_f16::f16::linalg::lu::test_lu_300x500_block_dispatch",
    "tensor_f16::f16::linalg::lu::test_lu_3x300x500_block_dispatch",
    "tensor_f16::f16::linalg::lu::test_lu_3x500x300_block_dispatch",
    "tensor_f16::f16::linalg::lu::test_lu_500x300_block_dispatch",
    "tensor_f16::f16::linalg::lu::test_lu_500x500_block_dispatch",
    "tensor_f16::f16::linalg::lu::test_lu_5x300x300_block_dispatch",
    "tensor_f16::f16::linalg::lu::test_lu_medium_tall",
    "tensor_f16::f16::linalg::lu::test_lu_medium_wide",
    "tensor_f16::f16::module::attention::test_attention_no_mask",
    "tensor_f16::f16::module::ctc::test_ctc_loss_long_mixed_input_lengths",
    "tensor_f16::f16::module::ctc::test_ctc_loss_long_sequence",
]

[[group]]
category = "precision"
reason = "F16 CTC loss gradients against a PyTorch F32 reference at `rel_abs(1e-3, 1e-3)`: burn-tt is off by up to 0.235 (`mixed_input_lengths`) and 0.025 (`repeated_labels`). Not burn-tt's arithmetic: Burn's default `ctc_loss` composes elementwise operations over a recursion of up to a dozen steps and each rounds to binary16, so the vendored tolerance, set for backends with a fused F32 CTC kernel, cannot hold. Burn-flex running the same composition in F16 misses the F32 gradient by the same amounts and agrees with burn-tt to 2.4e-4 (one binary16 step), which `step162_f16_arithmetic::ctc_gradient_in_f16_is_flexs_to_rounding_noise` asserts (the shortfall at least 100 times the disagreement). Fails in the `--exact` profile too (so it is not the matmul), as it does on card 0 (run 1791811392). The F32 versions of both pass. The tolerance stays as vendored."
tests = [
    "autodiff_f16::base::ctc::test_ctc_loss_grad_mixed_input_lengths",
    "autodiff_f16::base::ctc::test_ctc_loss_grad_repeated_labels",
]
