[[group]]
category = "precision"
reason = "BF16 rounding of the reference's inputs. `test_ctc_loss_matches_pytorch`: the test builds `log_softmax` of BF16 logits, so the log-probabilities are BF16 values; the CTC loss of sample 1 for exactly those values is 3.49106 in f64, which is 3.484375 as BF16, what burn-tt returns (the test's 3.5 comes from PyTorch's F32 inputs). `test_ctc_loss_grad`: for those log-probabilities the gradient element is -0.46064 in f64, which is -0.4609375 as BF16, what burn-tt returns; the test's -0.45898 is reproduced only when the CTC gradient is rounded to BF16 before the `log_softmax` backward (-0.45938). Reproduced by hand in f64 for both. burn-flex passes both, so its BF16 chain differs from burn-tt's; why burn-tt's gradient keeps the unrounded value at that point is not determined. They fail under `--accurate` too (run 1791829833), so it is not the Matrix Unit."
tests = [
    "autodiff_bf16::base::ctc::test_ctc_loss_grad",
    "tensor_bf16::bf16::module::ctc::test_ctc_loss_matches_pytorch",
]

[[group]]
category = "precision"
reason = "F32 and F16 (`tensor`, `autodiff`, `autodiff_checkpointing`, `tensor_f16`, `autodiff_f16`): the same Matrix Unit matmul as the `precision` entries of expected-failures.toml, whose reasons give the mechanism per group (TF32 operand truncation in Burn's LU, determinant, gelu gradient and conv2d compositions; the group adder in conv3d; binary16 steps in the F16 ones). They miss the vendored tolerance on silicon in the default mode (run 1791833700, card 0, `--strict`), as they do on ttsim, and each is listed there with the evidence that it passes under `--accurate` or `--exact`; this list does not repeat it, and does not claim an `--accurate` silicon run beyond the ones those entries cite (the 300 to 500 LU tests, F32 run 1791819292 and F16 run 1791820653). Five small LU and determinant tests listed there do NOT miss on silicon (`test_lu_2d_square`, `_2d_tall`, `_3d_square`, `_4d_square`, `test_det_20x20_singular_linearly_dependent`; three runs, all pass): they draw `Tensor::random` inputs, and the device PRNG is reproducible per target but not across them (ttsim-divergence.md row 99), so their outcome is a property of the data each target draws, not a numerical difference between ttsim and silicon."
tests = [
    "autodiff::base::gelu::should_diff_gelu",
    "autodiff_checkpointing::base::gelu::should_diff_gelu",
    "autodiff_f16::base::gelu::should_diff_gelu",
    "tensor::tensor::float::linalg::det::test_det_random_2x2x4x4_pytorch_comparison",
    "tensor::tensor::float::linalg::lu::test_lu_300x500_block_dispatch",
