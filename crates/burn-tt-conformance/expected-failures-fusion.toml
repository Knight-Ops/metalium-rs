# Tests of Burn's own backend suite (vendor/burn-backend-tests, pinned in PINS.toml)
# that burn-tt is expected to fail, and why. `cargo xtask conformance` compares
# every run with this file: an unlisted failure is a regression or a new finding,
# and a listed test that passes is stale, so the list only shrinks. The goal is an
# empty file.
#
# Never loosen a vendored tolerance to make a test pass; a `precision` entry
# names the mechanism, and says whether a bound has been derived.
#
# Test names are `<binary>::<test path>`, as `cargo xtask conformance --list`
# prints them.

[[group]]
category = "unsupported-dtype"
reason = "F64 is not a Tensix dtype: `float_cast` to F64 is refused by name (`dtype_usage(F64)` is empty). The two autodiff tests are `#[might_panic(reason = \\\"Unsupported precision for fusion\\\")]`, and burn-tensor-testgen 0.21.0's macro self-deadlocks (its panic hook takes the PANIC_LOG lock the failing body still holds) when the panic message differs, so they end as timeouts."
tests = [
    "autodiff::base::cast::cast_keeps_gradient_flow_might_panic",
    "autodiff_checkpointing::base::cast::cast_keeps_gradient_flow_might_panic",
    "tensor::tensor::float::ops::slice::should_support_slice_fill_cast_f64",
    "autodiff_f16::base::cast::cast_keeps_gradient_flow_might_panic",
    "tensor_f16::f16::ops::slice::should_support_slice_fill_cast_f64",
]

[[group]]
category = "precision"
reason = "A matmul truncates an F32 operand to TF32 (SrcRoute::Tf32FromFp32, 10 explicit mantissa bits): in grad_1[0][1] = 58.4628 - 57 the operand 40.4628 becomes 40.4375 (the step is 2^-5 between 32 and 64), so the result is 1.4375 against 1.46281, a relative error of 1.7e-2 against the test's permissive 1e-2. Reproduced by hand; the tolerance stays as vendored. Passes in the `--exact` profile on ttsim (`expected-failures-exact.toml`): the exact matmul has no TF32 truncation and no group alignment, so the mechanism is the Matrix Unit matmul."
tests = [
    "autodiff::base::gelu::should_diff_gelu",
    "autodiff_checkpointing::base::gelu::should_diff_gelu",
]

[[group]]
category = "precision"
reason = "Burn's LU composes matmuls, whose operands the unpacker truncates to TF32 (SrcRoute::Tf32FromFp32); elimination amplifies the error (observed 1.8e-2 to 2.3e-2 relative against the test's 5e-3, and a determinant of -2.5e-4 where 0 is expected). Attributed to TF32 operand truncation, not decomposed: a bound for this composition is not derived. Passes in the `--exact` profile on ttsim (`expected-failures-exact.toml`): the exact matmul has no TF32 truncation and no group alignment, so the mechanism is the Matrix Unit matmul."
tests = [
    "tensor::tensor::float::linalg::det::test_det_20x20_singular_linearly_dependent",
    "tensor::tensor::float::linalg::lu::test_lu_2d_square",
    "tensor::tensor::float::linalg::lu::test_lu_2d_tall",
    "tensor::tensor::float::linalg::lu::test_lu_3d_square",
    "tensor::tensor::float::linalg::lu::test_lu_3d_tall",
    "tensor::tensor::float::linalg::lu::test_lu_4d_square",
    "tensor::tensor::float::linalg::lu::test_lu_4d_tall",
]

[[group]]
category = "precision"
reason = "Not operand truncation: the operands are `arange` integers (x up to 720, weights up to 288), all exact in TF32, and every sum is exact in F32. The Matrix Unit adds the products of a 16-term `MVMUL` in two groups of eight, aligned once to a quantum of 2^(largest operand-exponent sum - 10) with each product rounded half-up to it, so a term small beside its group's largest loses its low bits: exact integers off by 1 to 96 on sums of 1.7e5 to 4.8e6, mostly high, a relative error of 1e-5 to 2.3e-5 against the test's 1e-5. The rule is measured and equals the device bit for bit on these tests (`step158_matmul_accumulation`, ttsim and card 0, run 1791754387; the same failure on silicon, runs 1791751200 and 1791751227), and the worst measured error is 0.44 of the bound it implies. A multi-pass TF32 split would not help (the operands are exact); it is a property of the FPU's reduction, so only a different reduction (an SFPU F32 accumulation, in order, as Flex does) would meet the vendored tolerance, which stays as it is. Passes in the `--exact` profile on ttsim (`expected-failures-exact.toml`)."
tests = [
    "tensor::tensor::float::module::conv3d::test_conv3d_complex",
    "tensor::tensor::float::module::conv3d::test_conv3d_groups",
]

[[group]]
category = "precision"
reason = "conv2d (TF32 operands, within step85's derived bound) followed by the test's batch-norm style subtraction of the mean: the error is 7.3e-3 relative (1.35e-4 absolute) against the test's 5e-3 and 1e-5. Attributed to TF32 operand truncation, not decomposed: a bound for this composition is not derived. Passes in the `--exact` profile on ttsim (`expected-failures-exact.toml`): the exact matmul has no TF32 truncation and no group alignment, so the mechanism is the Matrix Unit matmul."
tests = [
    "tensor::tensor::float::module::conv2d::test_conv2d_binary_broadcasted",
]

[[group]]
category = "precision"
reason = "Burn's LU composes matmuls whose operands the unpacker truncates to TF32; elimination amplifies the error, so these miss the vendored tolerance. Confirmed on silicon, card 0: the 300 to 500 square and rectangular ones finish there in 9 to 355 s and then fail the same tolerance (the small ones in under a second). Also too slow for ttsim in the canonical limit, except `test_det_random_2x2x4x4` (1.5% against the tolerance). Attributed to TF32 operand truncation, not decomposed: a bound for this composition is not derived. Passes in the `--exact` profile: on silicon in exact mode (card 0, run 1791758996; ttsim is too slow for the 300 to 500 ones, which are listed there as timeouts) and on ttsim for `test_det_random_2x2x4x4`."
tests = [
    "tensor::tensor::float::linalg::det::test_det_random_2x2x4x4_pytorch_comparison",
    "tensor::tensor::float::linalg::lu::test_lu_300x500_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_3x300x500_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_3x500x300_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_500x300_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_500x500_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_5x300x300_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_medium_tall",
    "tensor::tensor::float::linalg::lu::test_lu_medium_wide",
]

[[group]]
category = "timeout"
reason = "The simulator does not finish these in the limit (120 s in the canonical run; the CTC losses over 400 to 500 steps, the 300 x 300 determinants, and `[408, 261120] @ [261120, 408]`, each thousands of small device launches), but each passes on silicon, card 0: the CTC losses in 4 to 8 s (run 1791725576), the 300 x 300 determinants within the 900 s limit (run 1791725618), and the transaction matmul in 13 s (run 1791725132). Not a defect: ttsim speed."
tests = [
    "autodiff::base::ctc::test_ctc_loss_scaled_swap_dims_then_narrow_autodiff",
    "autodiff_checkpointing::base::ctc::test_ctc_loss_scaled_swap_dims_then_narrow_autodiff",
    "tensor::tensor::float::linalg::det::test_det_300x300_all_ones",
    "tensor::tensor::float::linalg::det::test_det_300x300_all_zeros",
    "tensor::tensor::float::linalg::det::test_det_300x300_identity_matrix",
    "tensor::tensor::float::module::ctc::test_ctc_loss_long_mixed_input_lengths",
    "tensor::tensor::float::module::ctc::test_ctc_loss_long_sequence",
    "tensor::tensor::float::ops::transaction::should_support_transaction",
]

[[group]]
category = "bug"
reason = "burn-fusion 0.21.0 panics on a Bool scalar: `ScalarIr::to_relative` (`stream/context.rs:1340`) is `todo!(\"Unsupported dtype ({self:?}) for scalar\")`, reached when the stream registers `bool_equal_elem`, `bool_not_equal_elem` or a `mask_fill` with a bool value; the fusion server thread dies and the client sees `CallError`. Not burn-tt's code, so only under `Fusion<TtBackend>` (the same tests pass on `TtBackend`), and a user of `burn_tt::Tt` meets it too. Needs an upstream change (hold the bool as a literal, as it holds none today). Roadmap, Track 1."
tests = [
    "tensor::tensor::bool::ops::comparison::test_bool_equal_elem",
    "tensor::tensor::bool::ops::comparison::test_bool_not_equal_elem",
    "tensor::tensor::bool::ops::mask::should_support_bool_mask_fill_ops",
]

[[group]]
category = "precision"
reason = "F16 (`tensor_f16`, `autodiff_f16`): the same Matrix Unit matmul as the F32 entries above. A matmul truncates its F32 operand to TF32 and adds in groups, and the F16 tests keep their vendored tolerances (`gelu` gradient 1.4375 against 1.4629, one binary16 step at 32 to 64; `cov` 1.13e-3 relative against 1e-3; the 2x2x4x4 determinant 1.1e-2 against 5e-3). Attributed by elimination, not by hand reproduction: all three pass in the `--exact` profile on ttsim (`expected-failures-exact.toml`), where the matmul has no TF32 truncation and no group alignment, and they fail the same way on card 0 (run 1791811392). Operands and results are binary16; the arithmetic between them is F32 on the card (`step162_f16_arithmetic`)."
tests = [
    "autodiff_f16::base::gelu::should_diff_gelu",
    "tensor_f16::f16::linalg::det::test_det_random_2x2x4x4_pytorch_comparison",
    "tensor_f16::f16::stats::cov::test_cov_1",
]

[[group]]
category = "timeout"
reason = "F16 (`tensor_f16`, `autodiff_f16`): the simulator does not finish these in the limit (120 s in the canonical run), as their F32 counterparts above, but each passes on silicon, card 0 (run 1791811392, 900 s limit): the 300 x 300 determinants in 37 to 38 s, the LU block dispatches in 9 to 355 s (they pass in F16, where the F32 ones miss the tolerance), the long CTC losses in 22 to 34 s, the transaction matmul in 18 s and the scaled swap-dims CTC gradient in 49 s. Not a defect: ttsim speed."
