[[group]]
category = "precision"
reason = "A matmul truncates an F32 operand to TF32 (SrcRoute::Tf32FromFp32, 10 explicit mantissa bits): in grad_1[0][1] = 58.4628 - 57 the operand 40.4628 becomes 40.4375 (the step is 2^-5 between 32 and 64), so the result is 1.4375 against 1.46281, a relative error of 1.7e-2 against the test's permissive 1e-2. Reproduced by hand; the tolerance stays as vendored."
tests = [
    "autodiff::base::gelu::should_diff_gelu",
    "autodiff_checkpointing::base::gelu::should_diff_gelu",
]

[[group]]
category = "precision"
reason = "Burn's LU composes matmuls, whose operands the unpacker truncates to TF32 (SrcRoute::Tf32FromFp32); elimination amplifies the error (observed 1.8e-2 to 2.3e-2 relative against the test's 5e-3, and a determinant of -2.5e-4 where 0 is expected). Attributed to TF32 operand truncation, not decomposed: a bound for this composition is not derived."
tests = [
    "tensor::tensor::float::linalg::det::test_det_20x20_singular_linearly_dependent",
    "tensor::tensor::float::linalg::lu::test_lu_2d_square",
    "tensor::tensor::float::linalg::lu::test_lu_2d_tall",
    "tensor::tensor::float::linalg::lu::test_lu_3d_square",
    "tensor::tensor::float::linalg::lu::test_lu_3d_tall",
    "tensor::tensor::float::linalg::lu::test_lu_4d_square",
    "tensor::tensor::float::linalg::lu::test_lu_4d_tall",
]

[[group]]
category = "precision"
reason = "conv2d (TF32 operands, within step85's derived bound) followed by the test's batch-norm style subtraction of the mean: the error is 7.3e-3 relative (1.35e-4 absolute) against the test's 5e-3 and 1e-5. Attributed to TF32 operand truncation, not decomposed: a bound for this composition is not derived."
tests = [
    "tensor::tensor::float::module::conv2d::test_conv2d_binary_broadcasted",
]

[[group]]
category = "precision"
reason = "Burn's LU composes matmuls whose operands the unpacker truncates to TF32; elimination amplifies the error, so these miss the vendored tolerance. Confirmed on silicon, card 0: the 300 to 500 square and rectangular ones finish there in 9 to 355 s and then fail the same tolerance (the small ones in under a second). Also too slow for ttsim in the canonical limit, except `test_det_random_2x2x4x4` (1.5% against the tolerance). Attributed to TF32 operand truncation, not decomposed: a bound for this composition is not derived."
tests = [
    "tensor::tensor::float::linalg::det::test_det_random_2x2x4x4_pytorch_comparison",
    "tensor::tensor::float::linalg::lu::test_lu_300x500_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_3x300x500_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_3x500x300_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_500x300_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_500x500_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_5x300x300_block_dispatch",
    "tensor::tensor::float::linalg::lu::test_lu_medium_tall",
    "tensor::tensor::float::linalg::lu::test_lu_medium_wide",
]

[[group]]
category = "timeout"
reason = "The simulator does not finish these in the limit (120 s in the canonical run; the CTC losses over 400 to 500 steps, the 300 x 300 determinants, and `[408, 261120] @ [261120, 408]`, each thousands of small device launches), but each passes on silicon, card 0: the CTC losses in 4 to 8 s (run 1791725576), the 300 x 300 determinants within the 900 s limit (run 1791725618), and the transaction matmul in 13 s (run 1791725132). Not a defect: ttsim speed."
tests = [
    "autodiff::base::ctc::test_ctc_loss_scaled_swap_dims_then_narrow_autodiff",
