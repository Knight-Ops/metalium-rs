# Tests of Burn's own backend suite (vendor/burn-backend-tests, pinned in PINS.toml)
# that burn-tt is expected to fail, and why. `cargo xtask conformance` compares
# every run with this file: an unlisted failure is a regression or a new finding,
# and a listed test that passes is stale, so the list only shrinks. The goal is an
# empty file.
#
# Never loosen a vendored tolerance to make a test pass; a `precision` entry
# names the mechanism, and says whether a bound has been derived.
#
# Test names are `<binary>::<test path>`, as `cargo xtask conformance --list`
# prints them.

[[group]]
category = "unsupported-dtype"
reason = "F64 is not a Tensix dtype: `float_cast` to F64 is refused by name (`dtype_usage(F64)` is empty). The two autodiff tests are `#[might_panic(reason = \\\"Unsupported precision for fusion\\\")]`, and burn-tensor-testgen 0.21.0's macro self-deadlocks (its panic hook takes the PANIC_LOG lock the failing body still holds) when the panic message differs, so they end as timeouts."
tests = [
    "autodiff::base::cast::cast_keeps_gradient_flow_might_panic",
    "autodiff_checkpointing::base::cast::cast_keeps_gradient_flow_might_panic",
    "tensor::tensor::float::ops::slice::should_support_slice_fill_cast_f64",
]

