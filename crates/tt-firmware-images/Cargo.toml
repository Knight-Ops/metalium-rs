[package]
name = "tt-firmware-images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The baby RISC-V firmware images, built from `crates/tt-firmware` by `build.rs`
# and checked for instructions Blackhole cannot execute. Shippable: the role
# images are what `tt-kernels` runs, so a backend needs them from a crate it can
# depend on, not from the test harness (`cargo xtask check-no-sim-in-ship`).
build = "build.rs"

# Off by default. `ttinsn-experiment` also builds the `ttinsn_t1` image
# (`docs/plans/ttinsn-push-experiment.md`) and relaxes the instruction-set gate for
# that one image's `.ttinsn` words, and nothing else. Shippable builds never turn it on.
[features]
ttinsn-experiment = []

[dependencies]
tt-isa.workspace = true

# The gate checks each admitted `.ttinsn` word against the instruction table.
[build-dependencies]
tt-isa.workspace = true
